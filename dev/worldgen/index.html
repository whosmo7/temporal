<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Worldgen debug</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16181d;
        --panel: #1f2229;
        --line: #333844;
        --text: #e4e6eb;
        --muted: #9097a3;
        --accent: #8fc7ff;
        --bad: #ff8f8f;
        font: 13px/1.4 system-ui, sans-serif;
      }
      body { margin: 0; background: var(--bg); color: var(--text); }
      .layout { display: flex; gap: 16px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; width: 300px; display: grid; gap: 10px; }
      .panel h1 { font-size: 15px; margin: 0; }
      .panel h2 { font-size: 12px; margin: 6px 0 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
      .row { display: flex; gap: 6px; align-items: center; }
      .row > label { width: 70px; color: var(--muted); }
      input, select, textarea, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
      input[type='number'] { width: 90px; }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      textarea { width: 100%; box-sizing: border-box; min-height: 90px; font-family: ui-monospace, monospace; font-size: 12px; }
      .checks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
      .checks label { color: var(--muted); }
      .error { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
      .muted { color: var(--muted); }
      #founder { white-space: pre-line; }
      ul { margin: 0; padding-left: 18px; }
      code, .mono { font-family: ui-monospace, monospace; font-size: 12px; }
      .stage { overflow: auto; max-width: 100%; }
      canvas { image-rendering: pixelated; border: 1px solid var(--line); border-radius: 4px; display: block; }
      .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
      .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
    </style>
  </head>
  <body>
    <div class="layout">
      <form class="panel" id="controls">
        <h1>Worldgen debug</h1>
        <div class="row">
          <label for="seed">Seed</label>
          <input id="seed" type="number" min="0" step="1" />
          <button type="button" id="prev" title="Previous seed">◀</button>
          <button type="button" id="next" title="Next seed">▶</button>
          <button type="button" id="random" title="Random seed">⚄</button>
        </div>
        <div class="row">
          <label for="biome">Biome</label>
          <select id="biome"><option value="forest">forest</option><option value="island">island</option></select>
        </div>
        <div class="row">
          <label for="preset">Preset</label>
          <select id="preset"></select>
        </div>
        <div class="row">
          <label for="gens">Gens</label>
          <input id="gens" type="number" min="1" max="200" step="1" />
        </div>
        <div class="row">
          <label for="zoom">Zoom</label>
          <select id="zoom"><option>8</option><option>12</option><option selected>16</option><option>24</option></select>
        </div>
        <div>
          <label for="overrides" class="muted">Overrides (JSON, merged over the preset)</label>
          <textarea id="overrides" spellcheck="false" placeholder='{ "fields": 3, "pin": { "well": { "x": 6, "y": 6 } } }'></textarea>
        </div>
        <div class="row">
          <button type="button" id="copy">Copy preset JSON</button>
          <button type="button" id="link">Copy link</button>
        </div>
        <div class="checks">
          <label><input type="checkbox" id="showGrid" /> grid</label>
          <label><input type="checkbox" id="showCollision" /> collision</label>
          <label><input type="checkbox" id="showReach" /> walk distance</label>
          <label><input type="checkbox" id="showLabels" checked /> labels</label>
        </div>
        <div class="error" id="error" hidden></div>
        <div id="info" class="mono muted"></div>
        <h2>Events</h2>
        <ul id="events" class="mono"></ul>
        <h2>Founder state</h2>
        <div id="founder" class="mono"></div>
        <h2>Plots</h2>
        <ul id="plots" class="mono"></ul>
        <h2>Legend</h2>
        <div id="legend" class="legend"></div>
      </form>
      <div class="stage"><canvas id="map"></canvas></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
